name: R3F FREE Same-Model Behavioral Campaign

# atomic-launch-version: 006
on:
  push:
    branches: [r3f-free-validation]
    paths:
      - 'r3f-free/LAUNCH_R3F_FREE_*.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      R3F_MODEL_ID: Qwen/Qwen2.5-0.5B-Instruct
    steps:
      - name: Checkout frozen branch state
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'r3f-free/requirements.txt'

      - name: Reconstruct and verify neutralized dataset
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          root = Path('r3f-free')
          names = [
              'neutralized_requests.part00.b64',
              'neutralized_requests.part0100.b64',
              'neutralized_requests.part0101.b64',
              'neutralized_requests.part0102.b64',
              'neutralized_requests.part0103.b64',
              'neutralized_requests.part01040.b64',
              'neutralized_requests.part01041.b64',
              'neutralized_requests.part01042.b64',
              'neutralized_requests.part01043.b64',
              'neutralized_requests.part01044.b64',
              'neutralized_requests.part011.b64',
              'neutralized_requests.part02.b64',
              'neutralized_requests.part03.b64',
              'neutralized_requests.part04.b64',
              'neutralized_requests.part05.b64',
          ]
          payload = ''.join((root / n).read_text(encoding='ascii').strip() for n in names)
          raw = gzip.decompress(base64.b64decode(payload, validate=True))
          digest = hashlib.sha256(raw).hexdigest()
          expected = '42cc5082864fb38913e104c52e2d1ee510d4b7c175f9cf32b483b369c7a8c0bf'
          if digest != expected:
              raise SystemExit(f'DATASET_DIGEST_MISMATCH:{digest}')
          (root / 'neutralized_requests.jsonl').write_bytes(raw)
          print(f'DATASET_OK sha256={digest} bytes={len(raw)}')
          PY

      - name: Install CPU inference stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install -r r3f-free/requirements.txt

      - name: Run 18 x 3 same-model generation campaign
        run: python r3f-free/run_campaign.py

      - name: Upload blind scoring bundle
        uses: actions/upload-artifact@v4
        with:
          name: r3f-free-blind-bundle
          path: r3f-free/out/blind_bundle.jsonl
          if-no-files-found: error
          retention-days: 7

      - name: Upload sealed mapping separately
        uses: actions/upload-artifact@v4
        with:
          name: r3f-free-mapping
          path: r3f-free/out/blind_mapping.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload run evidence
        uses: actions/upload-artifact@v4
        with:
          name: r3f-free-runs
          path: |
            r3f-free/out/runs.jsonl
            r3f-free/out/generation_receipt.json
          if-no-files-found: error
          retention-days: 7
